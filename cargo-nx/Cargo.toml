[package]
name = "cargo-nx"
version = "0.2.0"
authors = ["XorTroll", "LNSD"]
license = "MIT"
homepage = "https://github.com/nx-std/"
repository = "https://github.com/nx-std/tools/"
edition = "2024"
description = "Cargo subcommand to simplify creating and building Nintendo Switch homebrew projects"

[features]
## JSON Schema generation for the NPDM descriptor types
json-schema = ["dep:schemars"]

[dependencies]
anstyle = "1"
cargo_metadata = { version = "0.23" }
chrono = "0.4"
cipher = "0.5"
clap = { version = "4", features = ["derive"] }
num-bigint = "0.4"
nx-netloader = { version = "0.1.0", path = "../nx-netloader" }
nx-object = { git = "https://github.com/nx-std/nx-object.git", rev = "d9b2c686b5dc133fdfb6d497b93c7269749c5f09", features = ["elf-parsing", "lz4-compression"] }
schemars = { version = "1", optional = true }
serde = { workspace = true, features = ["std"] }
serde_derive = "1"
serde_json = "1"
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "signal", "time"] }
toml_edit = "0.22"
tracing.workspace = true
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
